<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
</head>

<body style="background-color:powderblue;">

  <section>
    <h2 style="font-size: 30px; text-align: center;">Contact Us</h2>
    <ul>
      <p style="text-align: center;">We'd love to hear from you! Here's how you can reach Hirono's Corner.</p>
      <li>Email: <a href="mailto:hironoscorner@gmail.com">hironoscorner@gmail.com</a></li>
      <li>Phone: +63 918 358 1669</li>
    <ul>
    
  </section>

<main>
  <form>
    
    <fieldset>
      <legend style="text-align: center;">Your details</legend>
      
      <p>
        <label for="name">Name</label><br>
        <input type="text" id="name" name="name" required>
      </p>
      
      <p>
        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" required>
      </p>
      
      <p>
        <label for="subject">Subject</label><br>
        <select id="subject" name="subject">
          <option value="product-question">General Inquiry</option>
          <option value="order-status">Menu & Product Inquiry</option>
          <option value="custom-art">Hirono Collection Inquiry</option>
          <option value="wholesale">Feedback & Suggestions</option>
          <option value="other">Other</option>
        </select>
      </p>
      
      <p>
        <label for="message">Message</label><br>
        <textarea id="message" name="message" required></textarea>
      </p>
      
      <button type="submit">Send message</button>
      
    </fieldset>
    
  </form>
</main>

<li><a href="https://dacanay-shamieh.github.io/hironos-corner/">My Shop</a></li>

</body>

<footer>
  <p style="text-align: center;">© 2026 Hirono’s Corner — A Little Corner for Wandering Souls. All rights reserved.</p>
</footer>

</html>
